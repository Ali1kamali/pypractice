[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pypractice"
version = "0.1.0"
description = "An offline Python practice library with categorized questions and answer evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "PyPractice Contributors" }
]
keywords = [
    "python",
    "practice",
    "education",
    "programming",
    "questions",
    "learning",
    "offline"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/pypractice"
Repository = "https://github.com/YOUR_USERNAME/pypractice"
Issues = "https://github.com/YOUR_USERNAME/pypractice/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pypractice = ["**/*.json", "**/*.txt"]